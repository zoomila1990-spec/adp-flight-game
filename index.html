<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ADP Flight League</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        .balance-title {
            font-size: 14px;
            color: #8a8f99;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-value {
            font-size: 36px;
            font-weight: 800;
            color: #00f0ff;
            margin-top: 4px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            height: 380px;
            background: linear-gradient(180deg, #121824 0%, #080a0f 100%);
            border: 2px solid #1e2638;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .plane-icon {
            font-size: 64px;
            margin-bottom: 10px;
        }

        .game-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .controls {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .btn-start {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            color: #000;
            background: #00f0ff;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transition: transform 0.1s;
        }

        .btn-start:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-title">Ваш Баланс</div>
        <div class="balance-value" id="balance">0 ADP</div>
    </div>

    <div class="game-container">
        <div class="plane-icon">✈️</div>
        <div class="game-title">ADP Flight Challenge</div>
    </div>

    <div class="controls">
        <button class="btn-start" onclick="startGame()">ИГРАТЬ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function startGame() {
            tg.showAlert("Игра запускается!");
        }
    </script>
</body>
</html>
