<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADP Flight League</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 14px 16px;
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        .user-info { text-align: left; }
        .user-name { font-size: 16px; font-weight: 700; margin: 0; }
        .user-sub { font-size: 12px; opacity: 0.6; margin: 2px 0 0 0; }

        .game-card {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .plane-icon { font-size: 56px; margin-bottom: 8px; display: block; }
        .title { font-size: 22px; font-weight: 800; margin: 0 0 16px 0; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px;
        }
        .stat-label { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
        .stat-value { font-size: 20px; font-weight: 800; color: #fff; margin-top: 4px; }

        .btn {
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-bottom: 10px;
        }
        .btn:active { transform: scale(0.98); }
        .btn-fly {
            background: linear-gradient(135deg, #ff9800, #e65100);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }
        .btn-ad {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar" id="user-avatar">✈️</div>
        <div class="user-info">
            <p class="user-name" id="user-name">Загрузка...</p>
            <p class="user-sub"><span id="user-username">@---</span> | ID: <span id="user-id">---</span></p>
        </div>
    </div>

    <div class="game-card">
        <span class="plane-icon">✈️</span>
        <h1 class="title">ADP Flight League</h1>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Баланс ADP</div>
                <div class="stat-value" id="adp-balance">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Попытки</div>
                <div class="stat-value" id="attempts-count">0</div>
            </div>
        </div>

        <button class="btn btn-fly" id="fly-btn" onclick="startFlight()">🚀 В полет!</button>
        <button class="btn btn-ad" id="ad-btn" onclick="watchAd()">📺 Посмотреть рекламу (<span id="ad-count">0</span>/5)</button>
    </div>

    <script>
        const API_URL = "https://stash-skilled-stucco.ngrok-free.dev";
        let currentUser = null;

        async function initApp() {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
                currentUser = tg.initDataUnsafe?.user;
            }

            if (!currentUser) {
                currentUser = { id: 1285150103, username: 'zoomila1990', first_name: 'Ivan' };
            }

            document.getElementById('user-name').innerText = currentUser.first_name + (currentUser.last_name ? ' ' + currentUser.last_name : '');
            document.getElementById('user-id').innerText = currentUser.id;
            document.getElementById('user-username').innerText = currentUser.username ? '@' + currentUser.username : 'без юзернейма';
            if (currentUser.first_name) {
                document.getElementById('user-avatar').innerText = currentUser.first_name[0].toUpperCase();
            }

            await syncWithBackend();
        }

        async function syncWithBackend() {
            try {
                const response = await fetch(`${API_URL}/api/user/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentUser.id,
                        username: currentUser.username || '',
                        first_name: currentUser.first_name || ''
                    })
                });

                const data = await response.json();
                if (data.status === 'ok') {
                    document.getElementById('ad-count').innerText = data.user.daily_ads_count;
                    document.getElementById('attempts-count').innerText = data.user.game_attempts;
                    document.getElementById('adp-balance').innerText = data.user.weekly_score;
                }
            } catch (e) {
                console.error("Ошибка подключения к API:", e);
            }
        }

        async function watchAd() {
            try {
                const response = await fetch(`${API_URL}/api/user/watch-ad`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentUser.id,
                        username: currentUser.username || '',
                        first_name: currentUser.first_name || ''
                    })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('ad-count').innerText = data.daily_ads_count;
                    document.getElementById('attempts-count').innerText = data.game_attempts;
                    if (data.daily_ads_count === 5) {
                        alert('Поздравляем! 5/5 рекламы просмотрено. Получена 1 попытка полета!');
                    } else {
                        alert(`Просмотр засчитан! (${data.daily_ads_count}/5)`);
                    }
                } else if (data.reason) {
                    alert(data.reason);
                }
            } catch (e) {
                alert("Ошибка связи с сервером.");
            }
        }

        function startFlight() {
            const attempts = parseInt(document.getElementById('attempts-count').innerText);
            if (attempts > 0) {
                alert('Полет начался! Удачи!');
            } else {
                alert('У вас нет доступных попыток! Посмотрите 5 видеореклам.');
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
