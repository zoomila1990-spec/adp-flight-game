<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADP Flight League</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 14px 16px;
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        .user-info { text-align: left; }
        .user-name { font-size: 16px; font-weight: 700; margin: 0; }
        .user-sub { font-size: 12px; opacity: 0.6; margin: 2px 0 0 0; }

        .game-card {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .plane-icon { font-size: 56px; margin-bottom: 8px; display: block; }
        .title { font-size: 22px; font-weight: 800; margin: 0 0 16px 0; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px;
        }
        .stat-label { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
        .stat-value { font-size: 20px; font-weight: 800; color: #fff; margin-top: 4px; }

        .btn {
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-bottom: 10px;
        }
        .btn:active { transform: scale(0.98); }
        .btn-fly {
            background: linear-gradient(135deg, #ff9800, #e65100);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }
        .btn-ad {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }
        
        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }
        canvas {
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            width: 100%;
            height: 360px;
        }
        .control-panel {
            width: 100%;
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .slider {
            width: 100%;
            appearance: none;
            height: 8px;
            border-radius: 4px;
            background: #475569;
            outline: none;
            opacity: 0.9;
            transition: opacity .2s;
        }
        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ff9800;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- Меню -->
    <div id="menu-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="profile-card">
            <div class="avatar" id="user-avatar">✈️</div>
            <div class="user-info">
                <p class="user-name" id="user-name">Загрузка...</p>
                <p class="user-sub"><span id="user-username">@---</span> | ID: <span id="user-id">---</span></p>
            </div>
        </div>

        <div class="game-card">
            <span class="plane-icon">✈️</span>
            <h1 class="title">ADP Flight League</h1>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Баланс ADP</div>
                    <div class="stat-value" id="adp-balance">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Попытки</div>
                    <div class="stat-value" id="attempts-count">0</div>
                </div>
            </div>

            <button class="btn btn-fly" id="fly-btn" onclick="startFlight()">🚀 В полет!</button>
            <button class="btn btn-ad" id="ad-btn" onclick="watchAd()">📺 Посмотреть рекламу (<span id="ad-count">0</span>/5)</button>
        </div>
    </div>

    <!-- Игровой экран -->
    <div id="game-container">
        <div class="game-card" style="margin-bottom: 10px; padding: 10px; width: 100%;">
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 16px;">
                <span>Счет: <span id="current-score">0</span></span>
                <span style="color: #ff9800;">✈️ Рандомный полет</span>
            </div>
        </div>
        
        <canvas id="flightCanvas" width="360" height="360"></canvas>

        <div class="control-panel">
            <div style="font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 600; text-transform: uppercase;">Управление полетом</div>
            <input type="range" min="0" max="360" value="180" class="slider" id="flightSlider">
        </div>

        <button class="btn btn-ad" style="margin-top: 10px;" onclick="returnToMenu()">⬅️ Назад в меню</button>
    </div>

    <script>
        const API_URL = "https://stash-skilled-stucco.ngrok-free.dev";
        let currentUser = null;

        const canvas = document.getElementById('flightCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('flightSlider');
        
        let gameInterval = null;
        let score = 0;
        let plane = { x: 180, y: 280, width: 28, height: 36 };
        let obstacles = [];
        let nextSpawnTime = 0;
        let frameCount = 0;
        let isPlaying = false;

        async function initApp() {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
                currentUser = tg.initDataUnsafe?.user;
            }

            if (!currentUser) {
                currentUser = { id: 1285150103, username: 'zoomila1990', first_name: 'Ivan' };
            }

            document.getElementById('user-name').innerText = currentUser.first_name + (currentUser.last_name ? ' ' + currentUser.last_name : '');
            document.getElementById('user-id').innerText = currentUser.id;
            document.getElementById('user-username').innerText = currentUser.username ? '@' + currentUser.username : 'без юзернейма';
            if (currentUser.first_name) {
                document.getElementById('user-avatar').innerText = currentUser.first_name[0].toUpperCase();
            }

            await syncWithBackend();
        }

        async function syncWithBackend() {
            try {
                const response = await fetch(`${API_URL}/api/user/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentUser.id,
                        username: currentUser.username || '',
                        first_name: currentUser.first_name || ''
                    })
                });

                const data = await response.json();
                if (data.status === 'ok') {
                    document.getElementById('ad-count').innerText = data.user.daily_ads_count;
                    document.getElementById('attempts-count').innerText = data.user.game_attempts;
                    document.getElementById('adp-balance').innerText = data.user.weekly_score;
                }
            } catch (e) {
                console.error("Ошибка подключения к API:", e);
            }
        }

        async function watchAd() {
            try {
                const response = await fetch(`${API_URL}/api/user/watch-ad`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentUser.id,
                        username: currentUser.username || '',
                        first_name: currentUser.first_name || ''
                    })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('ad-count').innerText = data.daily_ads_count;
                    document.getElementById('attempts-count').innerText = data.game_attempts;
                    if (data.daily_ads_count === 5) {
                        alert('Поздравляем! 5/5 рекламы просмотрено. Получена 1 попытка полета!');
                    } else {
                        alert(`Просмотр засчитан! (${data.daily_ads_count}/5)`);
                    }
                } else if (data.reason) {
                    alert(data.reason);
                }
            } catch (e) {
                alert("Ошибка связи с сервером.");
            }
        }

        async function startFlight() {
            const attempts = parseInt(document.getElementById('attempts-count').innerText);
            if (attempts <= 0) {
                alert('У вас нет доступных попыток! Посмотрите видеорекламу.');
                return;
            }

            document.getElementById('menu-container').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';

            score = 0;
            plane.x = canvas.width / 2 - plane.width / 2;
            slider.value = 180;
            obstacles = [];
            frameCount = 0;
            nextSpawnTime = 40; // Первое препятствие появится быстро
            isPlaying = true;

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 20);
        }

        slider.addEventListener('input', () => {
            if (isPlaying) {
                const sliderVal = parseInt(slider.value);
                plane.x = (sliderVal / 360) * (canvas.width - plane.width);
            }
        });

        function updateGame() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Динамический фон (движущиеся полосы трассы)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
            }
            ctx.stroke();

            // Отрисовка самолетика
            ctx.fillStyle = '#ff9800';
            ctx.fillRect(plane.x, plane.y, plane.width, plane.height);
            ctx.fillStyle = '#fff';
            ctx.font = '18px sans-serif';
            ctx.fillText('✈️', plane.x + 2, plane.y + 24);

            // Абсолютно рандомный спавн препятствий (разные типы: облако, здание, птица, шар)
            if (frameCount >= nextSpawnTime) {
                const types = [
                    { name: '☁️ Туча', color: '#64748b', w: Math.random() * 60 + 60, h: 26 },
                    { name: '🏢 Здание', color: '#334155', w: Math.random() * 50 + 50, h: 32 },
                    { name: '🦅 Птица', color: '#b45309', w: 35, h: 20 },
                    { name: '🎈 Шар', color: '#ef4444', w: 30, h: 30 }
                ];
                
                const selectedType = types[Math.floor(Math.random() * types.length)];
                const randomX = Math.random() * (canvas.width - selectedType.w);
                const randomSpeed = Math.random() * 1.5 + 2.2; // Разная скорость падения

                obstacles.push({
                    x: randomX,
                    y: -40,
                    width: selectedType.w,
                    height: selectedType.h,
                    name: selectedType.name,
                    color: selectedType.color,
                    speed: randomSpeed,
                    passed: false
                });

                // Следующее препятствие появится через случайное количество кадров (от 35 до 75)
                nextSpawnTime = frameCount + Math.floor(Math.random() * 40) + 35;
            }

            // Движение и отрисовка препятствий
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed;

                ctx.fillStyle = obstacles[i].color;
                ctx.fillRect(obstacles[i].x, obstacles[i].y, obstacles[i].width, obstacles[i].height);
                ctx.fillStyle = '#fff';
                ctx.font = '11px sans-serif';
                ctx.fillText(obstacles[i].name, obstacles[i].x + 4, obstacles[i].y + 17);

                // Начисление очков при успешном пролете
                if (!obstacles[i].passed && obstacles[i].y > plane.y + plane.height) {
                    score += 10;
                    obstacles[i].passed = true;
                    document.getElementById('current-score').innerText = score;
                }

                // Проверка столкновений с учетом размеров
                if (
                    plane.x < obstacles[i].x + obstacles[i].width &&
                    plane.x + plane.width > obstacles[i].x &&
                    plane.y < obstacles[i].y + obstacles[i].height &&
                    plane.y + plane.height > obstacles[i].y
                ) {
                    gameOver();
                }

                // Удаление объектов, вышедших за пределы экрана
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }
        }

        async function gameOver() {
            isPlaying = false;
            clearInterval(gameInterval);
            alert(`Игра окончена! Ваш счет: ${score}`);

            try {
                const response = await fetch(`${API_URL}/api/user/finish-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentUser.id,
                        score: score
                    })
                });
                await response.json();
            } catch (e) {
                console.error("Ошибка сохранения результатов игры:", e);
            }

            returnToMenu();
        }

        function returnToMenu() {
            isPlaying = false;
            clearInterval(gameInterval);
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('menu-container').style.display = 'flex';
            syncWithBackend();
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
