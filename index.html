<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADP Flight League</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0f172a 100%);
            --card-bg: rgba(22, 27, 34, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-green: #00ffcc;
            --accent-blue: #38bdf8;
            --accent-yellow: #facc15;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 30px;
        }

        /* Шапка профиля */
        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .profile-info h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .balance-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-green);
        }

        /* Карточка вознаграждений */
        .rewards-card {
            background: linear-gradient(135deg, rgba(250, 204, 21, 0.1), rgba(56, 189, 248, 0.05));
            border: 1px solid rgba(250, 204, 21, 0.2);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
        }

        .rewards-card h3 {
            font-size: 14px;
            color: var(--accent-yellow);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .rewards-card p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Главное меню / Кнопки действий */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Кнопка рекламы (теперь выше) */
        .btn-ad {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        /* Главная кнопка Играть (ниже, самая заметная) */
        .btn-play {
            background: linear-gradient(135deg, #00ffcc, #00b894);
            color: #0d1117;
            font-size: 18px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
        }

        .btn-secondary {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 14px;
            padding: 14px;
        }

        .attempts-counter {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: -6px;
        }

        /* Блок кошелька и рефералов */
        .row-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Скрытый экран игры (Canvas) */
        #game-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0f172a;
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background: linear-gradient(to bottom, #38bdf8, #0284c7);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div class="container" id="main-menu">
        <!-- Шапка профиля -->
        <div class="profile-card">
            <div class="profile-info">
                <h2 id="user-name">Пилот</h2>
                <div class="balance-badge">
                    💎 <span id="user-score">0</span> ADP
                </div>
            </div>
            <div style="font-size: 28px;">✈️</div>
        </div>

        <!-- Награды недели -->
        <div class="rewards-card">
            <h3>🏆 Награды недели</h3>
            <p>Топ-10 игроков в конце недели разделят призовой фонд в <b>TON</b> и эксклюзивные граммы наград!</p>
        </div>

        <!-- МЕНЮ КНОПОК -->
        <div class="menu-grid">
            <!-- 1. ПОСМОТРЕТЬ РЕКЛАМУ (теперь выше) -->
            <button class="btn btn-ad" onclick="watchAd()">
                📺 Смотреть рекламу (+50 ADP & +1 попытка)
            </button>
            <div class="attempts-counter" id="attempts-text">Доступно попыток полета: 0</div>

            <!-- 2. ИГРАТЬ (ниже, ярко-неоновая) -->
            <button class="btn btn-play" onclick="startGame()">
                🚀 НАЧАТЬ ПОЛЕТ
            </button>

            <!-- Дополнительные функции -->
            <div class="row-group">
                <button class="btn btn-secondary" onclick="openReferral()">
                    👥 Рефералы (+10 ADP)
                </button>
                <button class="btn btn-secondary" onclick="connectWallet()">
                    👛 Кошелек
                </button>
            </div>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="game-screen">
        <div style="color: white; font-size: 20px; font-weight: bold; margin-bottom: 10px;">
            Очки: <span id="current-game-score">0</span>
        </div>
        <canvas id="gameCanvas" width="360" height="500"></canvas>
        <div style="margin-top: 15px; color: var(--text-muted); font-size: 13px;">
            Удерживайте и ведите для управления самолетом
        </div>
    </div>

    <script>
        const API_URL = "https://stash-skilled-stucco.ngrok-free.dev"; // Укажите актуальный ngrok URL при локальном тестировании
        let tg = window.Telegram.WebApp;
        tg.expand();

        let userData = {
            telegram_id: tg.initDataUnsafe?.user?.id || 123456789,
            username: tg.initDataUnsafe?.user?.username || "pilot",
            first_name: tg.initDataUnsafe?.user?.first_name || "Пилот",
            weekly_score: 0,
            game_attempts: 0,
            daily_ads_count: 0
        };

        // Синхронизация при старте
        async function syncUser() {
            try {
                let response = await fetch(`${API_URL}/api/user/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: userData.telegram_id,
                        username: userData.username,
                        first_name: userData.first_name
                    })
                });
                let data = await response.json();
                if (data.status === 'ok') {
                    userData.weekly_score = data.user.weekly_score;
                    userData.game_attempts = data.user.game_attempts;
                    userData.daily_ads_count = data.user.daily_ads_count;
                    updateUI();
                }
            } catch (e) {
                console.log("Ошибка синхронизации:", e);
            }
        }

        function updateUI() {
            document.getElementById('user-name').innerText = userData.first_name;
            document.getElementById('user-score').innerText = userData.weekly_score;
            document.getElementById('attempts-text').innerText = `Доступно попыток полета: ${userData.game_attempts} (Реклама: ${userData.daily_ads_count}/5)`;
        }

        async function watchAd() {
            try {
                let response = await fetch(`${API_URL}/api/user/watch-ad`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: userData.telegram_id })
                });
                let data = await response.json();
                if (data.success) {
                    userData.game_attempts = data.game_attempts;
                    userData.weekly_score = data.weekly_score;
                    userData.daily_ads_count = data.daily_ads_count;
                    updateUI();
                    tg.showAlert("Реклама просмотрена! Получена попытка и бонусные ADP.");
                } else {
                    tg.showAlert(data.reason || "Лимит просмотров исчерпан");
                }
            } catch (e) {
                tg.showAlert("Ошибка подключения к серверу");
            }
        }

        function startGame() {
            if (userData.game_attempts <= 0) {
                tg.showAlert("У вас нет попыток! Посмотрите рекламу, чтобы получить попытку.");
                return;
            }
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            initCanvasGame();
        }

        function openReferral() {
            let refLink = `https://t.me/share/url?url=https://t.me/YourBotName?start=ref_${userData.telegram_id}&text=Присоединяйся к ADP Flight League и выигрывай TON!`;
            window.open(refLink, '_blank');
        }

        function connectWallet() {
            tg.showAlert("Интеграция кошелька TON Connect будет доступна в следующем обновлении!");
        }

        // Логика самой игры (полотно с самолетиком)
        let canvas, ctx, gameInterval;
        let plane = { x: 160, y: 400, width: 40, height: 30, vx: 0 };
        let obstacles = [];
        let score = 0;

        function initCanvasGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            obstacles = [];
            score = 0;
            plane.x = canvas.width / 2 - 20;
            plane.y = canvas.height - 70;

            // Управление касанием/мышкой
            canvas.onmousemove = (e) => {
                let rect = canvas.getBoundingClientRect();
                plane.x = e.clientX - rect.left - plane.width / 2;
            };
            canvas.ontouchmove = (e) => {
                let rect = canvas.getBoundingClientRect();
                plane.x = e.touches[0].clientX - rect.left - plane.width / 2;
            };

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 1000 / 60);
        }

        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Отрисовка самолета с ярко-оранжевыми крыльями
            ctx.fillStyle = '#f97316'; // Оранжевые крылья/корпус
            ctx.fillRect(plane.x, plane.y, plane.width, plane.height);
            ctx.fillStyle = '#ffffff'; // Кабина
            ctx.fillRect(plane.x + 12, plane.y + 5, 16, 10);

            // Генерация препятствий
            if (Math.random() < 0.03) {
                obstacles.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    width: 30,
                    height: 30,
                    speed: 3 + Math.random() * 2
                });
            }

            // Движение препятствий
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.y += obs.speed;

                ctx.fillStyle = '#ef4444'; // Метеориты/препятствия
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                // Столкновение
                if (
                    plane.x < obs.x + obs.width &&
                    plane.x + plane.width > obs.x &&
                    plane.y < obs.y + obs.height &&
                    plane.y + plane.height > obs.y
                ) {
                    endCanvasGame();
                    return;
                }

                if (obs.y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('current-game-score').innerText = score;
                }
            }
        }

        async function endCanvasGame() {
            clearInterval(gameInterval);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';

            try {
                let response = await fetch(`${API_URL}/api/user/finish-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: userData.telegram_id,
                        score: score
                    })
                });
                let data = await response.json();
                if (data.success) {
                    userData.weekly_score = data.weekly_score;
                    userData.game_attempts = data.game_attempts;
                    updateUI();
                    tg.showAlert(`Полет завершен! Заработано очков: ${score}. Они переведены в ADP!`);
                }
            } catch (e) {
                tg.showAlert(`Полет завершен! Очки: ${score}. Ошибка сохранения на сервере.`);
            }
        }

        // Запуск синхронизации при загрузке страницы
        syncUser();
    </script>
</body>
</html>
