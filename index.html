<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADP Flight League</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 12px 16px;
            width: 100%;
            max-width: 420px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }
        .user-info { text-align: left; }
        .user-name { font-size: 15px; font-weight: 700; margin: 0; }
        .user-sub { font-size: 11px; opacity: 0.6; margin: 2px 0 0 0; }

        .game-card {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 16px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .plane-icon { font-size: 48px; margin-bottom: 4px; display: block; }
        .title { font-size: 20px; font-weight: 800; margin: 0 0 12px 0; color: #ffffff; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 8px;
        }
        .stat-label { font-size: 10px; color: #cbd5e1; font-weight: 600; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: 800; color: #ffffff; margin-top: 2px; }

        .btn {
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-bottom: 8px;
        }
        .btn:active { transform: scale(0.98); }
        .btn-fly {
            background: linear-gradient(135deg, #ff9800, #e65100);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }
        .btn-ad {
            background: rgba(59, 130, 246, 0.25);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }
        
        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
        }
        canvas {
            background: #0284c7;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            height: 420px;
        }
        .control-panel {
            width: 100%;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .slider {
            width: 100%;
            appearance: none;
            height: 10px;
            border-radius: 5px;
            background: #334155;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ff9800;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            border: 2px solid #fff;
        }
    </style>
</head>
<body>

    <!-- Меню -->
    <div id="menu-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="profile-card">
            <div class="avatar" id="user-avatar">✈️</div>
            <div class="user-info">
                <p class="user-name" id="user-name">Загрузка...</p>
                <p class="user-sub"><span id="user-username">@---</span> | ID: <span id="user-id">---</span></p>
            </div>
        </div>

        <div class="game-card">
            <span class="plane-icon">✈️</span>
            <h1 class="title">ADP Flight League</h1>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Баланс ADP</div>
                    <div class="stat-value" id="adp-balance">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Попытки</div>
                    <div class="stat-value" id="attempts-count">0</div>
                </div>
            </div>

            <button class="btn btn-fly" onclick="startFlight()">🚀 В полет!</button>
            <button class="btn btn-ad" onclick="watchAd()">📺 Посмотреть рекламу (<span id="ad-count">0</span>/5)</button>
        </div>
    </div>

    <!-- Игровой экран -->
    <div id="game-container">
        <div class="game-card" style="margin-bottom: 8px; padding: 10px 14px; width: 100%;">
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; color: #ffffff;">
                <span>Счет: <span id="current-score" style="color: #60a5fa;">0</span></span>
                <span style="color: #fbbf24;">⚡ Хардкор: <span id="current-speed-level">x1.0</span></span>
            </div>
        </div>
        
        <canvas id="flightCanvas" width="380" height="420"></canvas>

        <div class="control-panel">
            <div style="font-size: 11px; color: #cbd5e1; margin-bottom: 4px; font-weight: 600; text-transform: uppercase;">Штурвал</div>
            <input type="range" min="0" max="380" value="190" class="slider" id="flightSlider">
        </div>

        <button class="btn btn-ad" style="margin-top: 8px;" onclick="returnToMenu()">⬅️ Назад в меню</button>
    </div>

    <script>
        const API_URL = "https://stash-skilled-stucco.ngrok-free.dev";
        let currentUser = null;

        const canvas = document.getElementById('flightCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('flightSlider');
        
        let gameInterval = null;
        let score = 0;
        let gameSpeedMultiplier = 1;
        
        let plane = { 
            x: 190, 
            y: 320, 
            width: 38, 
            height: 50, 
            targetX: 190, 
            speed: 0.15 
        };

        let obstacles = [];
        let nextSpawnTime = 0;
        let frameCount = 0;
        let isPlaying = false;

        async function initApp() {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
                currentUser = tg.initDataUnsafe?.user;
            }

            if (!currentUser) {
                currentUser = { id: 1285150103, username: 'zoomila1990', first_name: 'Ivan' };
            }

            document.getElementById('user-name').innerText = currentUser.first_name + (currentUser.last_name ? ' ' + currentUser.last_name : '');
            document.getElementById('user-id').innerText = currentUser.id;
            document.getElementById('user-username').innerText = currentUser.username ? '@' + currentUser.username : 'без юзернейма';
            if (currentUser.first_name) {
                document.getElementById('user-avatar').innerText = currentUser.first_name[0].toUpperCase();
            }

            await syncWithBackend();
        }

        async function syncWithBackend() {
            try {
                const response = await fetch(`${API_URL}/api/user/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentUser.id,
                        username: currentUser.username || '',
                        first_name: currentUser.first_name || ''
                    })
                });

                const data = await response.json();
                if (data.status === 'ok') {
                    document.getElementById('ad-count').innerText = data.user.daily_ads_count;
                    document.getElementById('attempts-count').innerText = data.user.game_attempts;
                    document.getElementById('adp-balance').innerText = data.user.weekly_score;
                }
            } catch (e) {
                console.error("Ошибка подключения к API:", e);
            }
        }

        async function watchAd() {
            try {
                const response = await fetch(`${API_URL}/api/user/watch-ad`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentUser.id,
                        username: currentUser.username || '',
                        first_name: currentUser.first_name || ''
                    })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('ad-count').innerText = data.daily_ads_count;
                    document.getElementById('attempts-count').innerText = data.game_attempts;
                } else if (data.reason) {
                    alert(data.reason);
                }
            } catch (e) {
                alert("Ошибка связи с сервером.");
            }
        }

        async function startFlight() {
            const attempts = parseInt(document.getElementById('attempts-count').innerText);
            if (attempts <= 0) {
                alert('У вас нет доступных попыток! Посмотрите видеорекламу.');
                return;
            }

            document.getElementById('menu-container').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';

            score = 0;
            gameSpeedMultiplier = 1;
            document.getElementById('current-speed-level').innerText = 'x1.0';
            document.getElementById('current-score').innerText = '0';

            plane.x = canvas.width / 2 - plane.width / 2;
            plane.targetX = plane.x;
            slider.value = plane.x + plane.width / 2;
            
            obstacles = [];
            frameCount = 0;
            nextSpawnTime = 30;
            isPlaying = true;

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 20);
        }

        slider.addEventListener('input', () => {
            if (isPlaying) {
                plane.targetX = parseInt(slider.value) - plane.width / 2;
            }
        });

        function updateGame() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Плавное увеличение сложности (скорости игры) со временем
            gameSpeedMultiplier = 1 + (score * 0.03); // Чем выше счет, тем быстрее всё падает
            if (gameSpeedMultiplier > 2.5) gameSpeedMultiplier = 2.5; // Ограничение максимальной скорости
            document.getElementById('current-speed-level').innerText = gameSpeedMultiplier.toFixed(1);

            // Движение самолета с инерцией
            let dx = plane.targetX - plane.x;
            plane.x += dx * plane.speed;

            if (plane.x < 0) plane.x = 0;
            if (plane.x > canvas.width - plane.width) plane.x = canvas.width - plane.width;

            let maxTilt = 0.6;
            let tilt = dx * 0.04;
            if (tilt > maxTilt) tilt = maxTilt;
            if (tilt < -maxTilt) tilt = -maxTilt;

            // Отрисовка красивого фирменного самолетика (как в иконке меню)
            ctx.save();
            ctx.translate(plane.x + plane.width / 2, plane.y + plane.height / 2);
            ctx.rotate(tilt);

            // Тень
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.beginPath();
            ctx.ellipse(4, 6, 14, 24, 0, 0, Math.PI * 2);
            ctx.fill();

            // Основной корпус (белый самолет)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(8, -10);
            ctx.lineTo(7, 18);
            ctx.lineTo(0, 25);
            ctx.lineTo(-7, 18);
            ctx.lineTo(-8, -10);
            ctx.closePath();
            ctx.fill();

            // Кабина пилота
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.arc(0, -15, 4, 0, Math.PI * 2);
            ctx.fill();

            // Ярко-оранжевые крылья (как на иконке)
            ctx.fillStyle = '#ff9800';
            ctx.beginPath();
            ctx.moveTo(-22, -2);
            ctx.lineTo(22, -2);
            ctx.lineTo(14, 10);
            ctx.lineTo(-14, 10);
            ctx.closePath();
            ctx.fill();

            // Хвостовое оперение
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.moveTo(-11, 18);
            ctx.lineTo(11, 18);
            ctx.lineTo(6, 23);
            ctx.lineTo(-6, 23);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            // Спавн препятствий с учетом текущей скорости
            let spawnIntervalThreshold = Math.max(12, 35 - Math.floor(score * 0.8));
            if (frameCount >= nextSpawnTime) {
                const types = [
                    { type: 'meteor', w: 55, h: 55, speed: 3.5 },
                    { type: 'bird', w: 40, h: 30, speed: 4.0 },
                    { type: 'cloud', w: 75, h: 45, speed: 2.6 }
                ];
                
                const selected = types[Math.floor(Math.random() * types.length)];
                const randomX = Math.random() * (canvas.width - selected.w);

                obstacles.push({
                    x: randomX,
                    y: -70,
                    width: selected.w,
                    height: selected.h,
                    type: selected.type,
                    baseSpeed: selected.speed,
                    passed: false
                });

                nextSpawnTime = frameCount + Math.floor(Math.random() * spawnIntervalThreshold) + 15;
            }

            // Движение и отрисовка препятствий
            for (let i = obstacles.length - 1; i >= 0; i--) {
                // Применяем текущий множитель скорости игры
                obstacles[i].y += obstacles[i].baseSpeed * gameSpeedMultiplier;

                ctx.save();
                if (obstacles[i].type === 'meteor') {
                    ctx.fillStyle = '#475569';
                    ctx.beginPath();
                    ctx.arc(obstacles[i].x + obstacles[i].width/2, obstacles[i].y + obstacles[i].height/2, obstacles[i].width/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#334155';
                    ctx.beginPath();
                    ctx.arc(obstacles[i].x + 15, obstacles[i].y + 20, 8, 0, Math.PI * 2);
                    ctx.arc(obstacles[i].x + 35, obstacles[i].y + 35, 6, 0, Math.PI * 2);
                    ctx.fill();
                } else if (obstacles[i].type === 'bird') {
                    ctx.strokeStyle = '#b45309';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    let bx = obstacles[i].x + obstacles[i].width/2;
                    let by = obstacles[i].y + obstacles[i].height/2;
                    ctx.moveTo(bx - 20, by - 10);
                    ctx.quadraticCurveTo(bx - 10, by + 10, bx, by);
                    ctx.quadraticCurveTo(bx + 10, by + 10, bx + 20, by - 10);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    let cx = obstacles[i].x + obstacles[i].width / 2;
                    let cy = obstacles[i].y + obstacles[i].height / 2;
                    ctx.beginPath();
                    ctx.arc(cx - 15, cy, 18, 0, Math.PI * 2);
                    ctx.arc(cx + 15, cy, 20, 0, Math.PI * 2);
                    ctx.arc(cx, cy - 6, 22, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // Начисление счета строго по 1 очку за объект
                if (!obstacles[i].passed && obstacles[i].y > plane.y + plane.height) {
                    score += 1; // Увеличено на 1 за каждое препятствие
                    obstacles[i].passed = true;
                    document.getElementById('current-score').innerText = score;
                }

                // Проверка столкновений
                let hitBoxMargin = 6;
                if (
                    plane.x + hitBoxMargin < obstacles[i].x + obstacles[i].width - hitBoxMargin &&
                    plane.x + plane.width - hitBoxMargin > obstacles[i].x + hitBoxMargin &&
                    plane.y + hitBoxMargin < obstacles[i].y + obstacles[i].height - hitBoxMargin &&
                    plane.y + plane.height - hitBoxMargin > obstacles[i].y + hitBoxMargin
                ) {
                    gameOver();
                }

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }
        }

        async function gameOver() {
            isPlaying = false;
            clearInterval(gameInterval);
            alert(`Крушение! Самолет потерпел аварию.\nИтоговый счет: ${score}`);

            try {
                await fetch(`${API_URL}/api/user/finish-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentUser.id,
                        score: score
                    })
                });
            } catch (e) {
                console.error("Ошибка сохранения результатов игры:", e);
            }

            returnToMenu();
        }

        function returnToMenu() {
            isPlaying = false;
            clearInterval(gameInterval);
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('menu-container').style.display = 'flex';
            syncWithBackend();
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
