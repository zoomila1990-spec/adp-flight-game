<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADP Flight League</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 12px 16px;
            width: 100%;
            max-width: 420px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
        }
        .user-info { text-align: left; }
        .user-name { font-size: 15px; font-weight: 700; margin: 0; }
        .user-sub { font-size: 11px; opacity: 0.6; margin: 2px 0 0 0; }

        .game-card {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 16px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .plane-icon { font-size: 48px; margin-bottom: 4px; display: block; }
        .title { font-size: 20px; font-weight: 800; margin: 0 0 12px 0; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 8px;
        }
        .stat-label { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: 800; color: #fff; margin-top: 2px; }

        .btn {
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-bottom: 8px;
        }
        .btn:active { transform: scale(0.98); }
        .btn-fly {
            background: linear-gradient(135deg, #ff9800, #e65100);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }
        .btn-ad {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }
        
        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
        }
        canvas {
            background: #0284c7; /* Цвет неба летного поля */
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            height: 420px;
        }
        .control-panel {
            width: 100%;
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .slider {
            width: 100%;
            appearance: none;
            height: 10px;
            border-radius: 5px;
            background: #334155;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ff9800;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            border: 2px solid #fff;
        }
    </style>
</head>
<body>

    <!-- Меню -->
    <div id="menu-container" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="profile-card">
            <div class="avatar" id="user-avatar">✈️</div>
            <div class="user-info">
                <p class="user-name" id="user-name">Загрузка...</p>
                <p class="user-sub"><span id="user-username">@---</span> | ID: <span id="user-id">---</span></p>
            </div>
        </div>

        <div class="game-card">
            <span class="plane-icon">✈️</span>
            <h1 class="title">ADP Flight League</h1>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Баланс ADP</div>
                    <div class="stat-value" id="adp-balance">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Попытки</div>
                    <div class="stat-value" id="attempts-count">0</div>
                </div>
            </div>

            <button class="btn btn-fly" onclick="startFlight()">🚀 В полет!</button>
            <button class="btn btn-ad" onclick="watchAd()">📺 Посмотреть рекламу (<span id="ad-count">0</span>/5)</button>
        </div>
    </div>

    <!-- Игровой экран -->
    <div id="game-container">
        <div class="game-card" style="margin-bottom: 8px; padding: 8px 14px; width: 100%;">
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 15px;">
                <span>Счет: <span id="current-score">0</span></span>
                <span style="color: #ff9800;">⚡ Хардкор полет</span>
            </div>
        </div>
        
        <canvas id="flightCanvas" width="380" height="420"></canvas>

        <div class="control-panel">
            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-weight: 600; text-transform: uppercase;">Штурвал (с инерцией)</div>
            <input type="range" min="0" max="380" value="190" class="slider" id="flightSlider">
        </div>

        <button class="btn btn-ad" style="margin-top: 8px;" onclick="returnToMenu()">⬅️ Назад в меню</button>
    </div>

    <script>
        const API_URL = "https://stash-skilled-stucco.ngrok-free.dev";
        let currentUser = null;

        const canvas = document.getElementById('flightCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('flightSlider');
        
        let gameInterval = null;
        let score = 0;
        
        // Параметры самолета с инерцией
        let plane = { 
            x: 190, 
            y: 330, 
            width: 32, 
            height: 44, 
            targetX: 190, 
            speed: 0.12 // Коэффициент задержки (инерции) движения
        };

        let obstacles = [];
        let backgroundScenery = []; // Ландшафт внизу (дороги, поля, реки)
        let nextSpawnTime = 0;
        let frameCount = 0;
        let isPlaying = false;

        async function initApp() {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
                currentUser = tg.initDataUnsafe?.user;
            }

            if (!currentUser) {
                currentUser = { id: 1285150103, username: 'zoomila1990', first_name: 'Ivan' };
            }

            document.getElementById('user-name').innerText = currentUser.first_name + (currentUser.last_name ? ' ' + currentUser.last_name : '');
            document.getElementById('user-id').innerText = currentUser.id;
            document.getElementById('user-username').innerText = currentUser.username ? '@' + currentUser.username : 'без юзернейма';
            if (currentUser.first_name) {
                document.getElementById('user-avatar').innerText = currentUser.first_name[0].toUpperCase();
            }

            await syncWithBackend();
        }

        async function syncWithBackend() {
            try {
                const response = await fetch(`${API_URL}/api/user/sync`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentUser.id,
                        username: currentUser.username || '',
                        first_name: currentUser.first_name || ''
                    })
                });

                const data = await response.json();
                if (data.status === 'ok') {
                    document.getElementById('ad-count').innerText = data.user.daily_ads_count;
                    document.getElementById('attempts-count').innerText = data.user.game_attempts;
                    document.getElementById('adp-balance').innerText = data.user.weekly_score;
                }
            } catch (e) {
                console.error("Ошибка подключения к API:", e);
            }
        }

        async function watchAd() {
            try {
                const response = await fetch(`${API_URL}/api/user/watch-ad`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentUser.id,
                        username: currentUser.username || '',
                        first_name: currentUser.first_name || ''
                    })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('ad-count').innerText = data.daily_ads_count;
                    document.getElementById('attempts-count').innerText = data.game_attempts;
                    if (data.daily_ads_count === 5) {
                        alert('Поздравляем! 5/5 рекламы просмотрено. Получена 1 попытка полета!');
                    } else {
                        alert(`Просмотр засчитан! (${data.daily_ads_count}/5)`);
                    }
                } else if (data.reason) {
                    alert(data.reason);
                }
            } catch (e) {
                alert("Ошибка связи с сервером.");
            }
        }

        async function startFlight() {
            const attempts = parseInt(document.getElementById('attempts-count').innerText);
            if (attempts <= 0) {
                alert('У вас нет доступных попыток! Посмотрите видеорекламу.');
                return;
            }

            document.getElementById('menu-container').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';

            score = 0;
            plane.x = canvas.width / 2 - plane.width / 2;
            plane.targetX = plane.x;
            slider.value = plane.x;
            
            obstacles = [];
            backgroundScenery = [];
            frameCount = 0;
            nextSpawnTime = 30;
            isPlaying = true;

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 20);
        }

        // Ползунок задает целевую точку, к которой самолет плавно стремится (создает задержку/инерцию)
        slider.addEventListener('input', () => {
            if (isPlaying) {
                plane.targetX = parseInt(slider.value) - plane.width / 2;
            }
        });

        function updateGame() {
            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Отрисовка фоновой местности (движущаяся река / дороги под самолетом)
            if (frameCount % 40 === 0) {
                backgroundScenery.push({
                    y: -50,
                    x: Math.random() * (canvas.width - 60) + 20,
                    type: Math.random() > 0.5 ? 'river' : 'road',
                    width: Math.random() * 30 + 20
                });
            }

            for (let i = backgroundScenery.length - 1; i >= 0; i--) {
                backgroundScenery[i].y += 3.5;
                ctx.fillStyle = backgroundScenery[i].type === 'river' ? 'rgba(56, 189, 248, 0.3)' : 'rgba(100, 116, 139, 0.2)';
                ctx.fillRect(backgroundScenery[i].x, backgroundScenery[i].y, backgroundScenery[i].width, 60);

                if (backgroundScenery[i].y > canvas.height) {
                    backgroundScenery.splice(i, 1);
                }
            }

            // 2. Плавное движение самолета с инерцией (задержкой)
            let dx = plane.targetX - plane.x;
            plane.x += dx * plane.speed;

            // Ограничение по краям экрана
            if (plane.x < 10) plane.x = 10;
            if (plane.x > canvas.width - plane.width - 10) plane.x = canvas.width - plane.width - 10;

            // Вычисляем угол наклона самолета в зависимости от того, куда он поворачивает
            let tilt = dx * 0.05; 

            // Рисуем красивый графический самолет (вид сверху)
            ctx.save();
            ctx.translate(plane.x + plane.width / 2, plane.y + plane.height / 2);
            ctx.rotate(tilt);

            // Тень самолета
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(-plane.width/2 + 4, -plane.height/2 + 6, plane.width, plane.height);

            // Корпус
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.ellipse(0, 0, 8, plane.height/2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Крылья
            ctx.fillStyle = '#f97316'; // Ярко-оранжевые крылья
            ctx.fillRect(-plane.width/2, -6, plane.width, 12);

            // Нос самолета
            ctx.fillStyle = '#ea580c';
            ctx.beginPath();
            ctx.arc(0, -plane.height/2 + 4, 7, 0, Math.PI, true);
            ctx.fill();

            // Хвостовое оперение
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(-10, plane.height/2 - 8, 20, 6);

            ctx.restore();

            // 3. Спавн рандомных препятствий (пушистые облака и массивные здания)
            if (frameCount >= nextSpawnTime) {
                const types = [
                    { name: 'cloud', color: 'rgba(255, 255, 255, 0.85)', w: Math.random() * 80 + 70, h: 45 },
                    { name: 'building', color: '#334155', roofColor: '#1e293b', w: Math.random() * 70 + 60, h: 50 }
                ];
                
                const selected = types[Math.floor(Math.random() * types.length)];
                const randomX = Math.random() * (canvas.width - selected.w - 20) + 10;
                const randomSpeed = Math.random() * 1.2 + 3.2; // Повышенная скорость для сложности

                obstacles.push({
                    x: randomX,
                    y: -60,
                    width: selected.w,
                    height: selected.h,
                    type: selected.name,
                    color: selected.color,
                    roofColor: selected.roofColor || '#fff',
                    speed: randomSpeed,
                    passed: false
                });

                // Уменьшенные интервалы — препятствия идут чаще
                nextSpawnTime = frameCount + Math.floor(Math.random() * 30) + 25;
            }

            // 4. Движение и отрисовка препятствий
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += obstacles[i].speed;

                ctx.save();
                if (obstacles[i].type === 'cloud') {
                    // Рисуем красивое пушистое облако из мягких кругов
                    ctx.fillStyle = obstacles[i].color;
                    let cx = obstacles[i].x + obstacles[i].width / 2;
                    let cy = obstacles[i].y + obstacles[i].height / 2;
                    ctx.beginPath();
                    ctx.arc(cx - 15, cy, obstacles[i].height * 0.4, 0, Math.PI * 2);
                    ctx.arc(cx + 15, cy, obstacles[i].height * 0.45, 0, Math.PI * 2);
                    ctx.arc(cx, cy - 8, obstacles[i].height * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Рисуем детальное здание с крышей и окнами в виде сетки
                    ctx.fillStyle = obstacles[i].color;
                    ctx.fillRect(obstacles[i].x, obstacles[i].y, obstacles[i].width, obstacles[i].height);
                    
                    // Крыша здания
                    ctx.fillStyle = obstacles[i].roofColor;
                    ctx.fillRect(obstacles[i].x + 6, obstacles[i].y + 6, obstacles[i].width - 12, obstacles[i].height - 12);

                    // Окна
                    ctx.fillStyle = 'rgba(253, 224, 71, 0.6);'; // Светящиеся окна
                    for (let wx = obstacles[i].x + 12; wx < obstacles[i].x + obstacles[i].width - 12; wx += 14) {
                        for (let wy = obstacles[i].y + 12; wy < obstacles[i].y + obstacles[i].height - 12; wy += 14) {
                            ctx.fillRect(wx, wy, 6, 8);
                        }
                    }
                }
                ctx.restore();

                // Начисление очков
                if (!obstacles[i].passed && obstacles[i].y > plane.y + plane.height) {
                    score += 10;
                    obstacles[i].passed = true;
                    document.getElementById('current-score').innerText = score;
                }

                // Проверка точных столкновений (хитбокс)
                if (
                    plane.x + 4 < obstacles[i].x + obstacles[i].width - 4 &&
                    plane.x + plane.width - 4 > obstacles[i].x + 4 &&
                    plane.y + 4 < obstacles[i].y + obstacles[i].height - 4 &&
                    plane.y + plane.height - 4 > obstacles[i].y + 4
                ) {
                    gameOver();
                }

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }
        }

        async function gameOver() {
            isPlaying = false;
            clearInterval(gameInterval);
            alert(`Крушение! Самолет потерпел аварию.\nИтоговый счет: ${score}`);

            try {
                const response = await fetch(`${API_URL}/api/user/finish-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentUser.id,
                        score: score
                    })
                });
                await response.json();
            } catch (e) {
                console.error("Ошибка сохранения результатов игры:", e);
            }

            returnToMenu();
        }

        function returnToMenu() {
            isPlaying = false;
            clearInterval(gameInterval);
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('menu-container').style.display = 'flex';
            syncWithBackend();
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
